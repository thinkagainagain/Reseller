services:
  - type: web
    name: rebooty-ops-production
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DB_CLIENT
        value: pg
      - key: DB_SSL
        value: "true"
      - key: EBAY_ENV
        value: production
      - key: R2_BUCKET
        value: rebooty-uploads-prod
      # Temporary -- points at Render's own onrender.com URL until Phase 7
      # verification passes and Phase 8's DNS cutover happens. Do not set
      # this to the real domain until then (see docs/handoff.md).
      - key: APP_PUBLIC_URL
        value: https://rebooty-ops-production.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_DEV_ID
        sync: false
      - key: EBAY_REFRESH_TOKEN
        sync: false
      - key: EBAY_PAYMENT_POLICY_ID
        sync: false
      - key: EBAY_RETURN_POLICY_ID
        sync: false
      - key: EBAY_FULFILLMENT_POLICY_ID
        sync: false
      - key: EBAY_SHIP_FROM_POSTAL_CODE
        sync: false
      - key: EBAY_SHIP_FROM_COUNTRY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: rebooty-ops-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: staging
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DB_CLIENT
        value: pg
      - key: DB_SSL
        value: "true"
      - key: EBAY_ENV
        value: sandbox
      - key: R2_BUCKET
        value: rebooty-uploads-staging
      - key: APP_PUBLIC_URL
        value: https://rebooty-ops-staging.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_DEV_ID
        sync: false
      - key: EBAY_REFRESH_TOKEN
        sync: false
      - key: EBAY_PAYMENT_POLICY_ID
        sync: false
      - key: EBAY_RETURN_POLICY_ID
        sync: false
      - key: EBAY_FULFILLMENT_POLICY_ID
        sync: false
      - key: EBAY_SHIP_FROM_POSTAL_CODE
        sync: false
      - key: EBAY_SHIP_FROM_COUNTRY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
